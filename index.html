<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect CI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-container">
        
        <!-- ONGLET 1 : ACCUEIL -->
        <div id="page-accueil" class="content-area">
            <h1>EduConnect 🇨🇮</h1>
            <p>Trouve un répétiteur de confiance partout en Côte d'Ivoire.</p>

            <!-- Compteur dynamique -->
            <div class="stat-badge">
                🚀 <span id="compteur-profs">0</span> répétiteurs disponibles actuellement
            </div>

            <button class="btn btn-eleve" onclick="changerOnglet('eleve')">🎓 Je cherche un Répétiteur</button>
            <button class="btn btn-prof" onclick="changerOnglet('prof')">👨‍🏫 Je veux donner des cours</button>
        </div>

        <!-- ONGLET 2 : LISTE PROFS PARA LES ÉLÈVES -->
        <div id="page-eleve" class="content-area hidden">
            <h1>Trouver un Répétiteur</h1>
            <input type="text" id="moteur-recherche" class="search-bar" placeholder="🔍 Rechercher une ville, matière..." onkeyup="filtrerProfs()">
            <div id="liste-professeurs">
                <!-- Les cartes s'injecteront ici -->
            </div>
        </div>

        <!-- ONGLET 3 : FORMULAIRE D'INSCRIPTION PROF -->
        <div id="page-prof" class="content-area hidden">
            <h1>Espace Répétiteur</h1>
            <form id="form-inscription" onsubmit="enregistrerProf(event)">
                <div class="form-group">
                    <label for="nom">Nom & Prénom</label>
                    <input type="text" id="nom" required placeholder="Ex: M. Kouakou">
                </div>
                <div class="form-group">
                    <label for="matiere">Matière</label>
                    <select id="matiere">
                        <option value="Mathématiques">Mathématiques</option>
                        <option value="Physique-Chimie">Physique-Chimie</option>
                        <option value="Français">Français</option>
                        <option value="Anglais">Anglais</option>
                        <option value="Informatique">Informatique</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ville">Ville</label>
                    <select id="ville">
                        <option value="Abidjan">Abidjan</option>
                        <option value="Bouaké">Bouaké</option>
                        <option value="Yamoussoukro">Yamoussoukro</option>
                        <option value="Korhogo">Korhogo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quartier">Quartier</label>
                    <input type="text" id="quartier" required placeholder="Ex: Commerce, Zone 4">
                </div>
                <div class="form-group">
                    <label for="whatsapp">Numéro WhatsApp (ex: 0708091011)</label>
                    <input type="tel" id="whatsapp" required placeholder="Numéro de téléphone">
                </div>
                <button type="submit" class="btn btn-prof">Créer mon profil</button>
            </form>
        </div>

        <!-- BARRE DE NAVIGATION FIXE EN BAS -->
        <div class="nav-bar">
            <div id="tab-accueil" class="nav-item active" onclick="changerOnglet('accueil')">Accueil</div>
            <div id="tab-eleve" class="nav-item" onclick="changerOnglet('eleve')">Élèves</div>
            <div id="tab-prof" class="nav-item" onclick="changerOnglet('prof')">Répétiteurs</div>
        </div>

    </div>

    <!-- On force l'exécution en module pour autoriser les connexions sécurisées -->
    <script type="module" src="app.js"></script>
</body>
</html>
